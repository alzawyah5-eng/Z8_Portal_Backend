services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-z8_dev}
      POSTGRES_USER: ${POSTGRES_USER:-z8}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend_z8-card-flow/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - z8-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-z8} -d ${POSTGRES_DB:-z8_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  z8-postgres-data:
